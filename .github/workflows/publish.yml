name: Publish NuGet

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish PGLN.Auth
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Display .NET information
        run: dotnet --info

      - name: Restore
        run: dotnet restore PGLN.Auth.slnx

      - name: Build
        run: >
          dotnet build PGLN.Auth.slnx
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test PGLN.Auth.slnx
          --configuration Release
          --no-build
          --no-restore

      - name: Download frozen v0.1.0 package
        shell: bash
        run: |
          mkdir -p artifacts/publish

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --output artifacts/publish/PGLN.Auth.0.1.0.nupkg \
            https://github.com/NuGetPackagesPGLN/PGLN.JwtAuth/releases/download/v0.1.0/PGLN.Auth.0.1.0.nupkg

      - name: Verify package SHA-256
        shell: bash
        run: |
          echo "C5CE36B69F850BDE9F8DD7D7E072901C142EC58DAFF50DF60842BF6F096938B8  artifacts/publish/PGLN.Auth.0.1.0.nupkg" \
            | sha256sum --check

      - name: Authenticate to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Nathi-devDot

      - name: Publish PGLN.Auth 0.1.0
        run: >
          dotnet nuget push
          artifacts/publish/PGLN.Auth.0.1.0.nupkg
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
