name: Publish NuGet

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish PGLN.Auth
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pgln_test
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: pgln_auth_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgln_test -d pgln_auth_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    environment: release
    timeout-minutes: 20

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Display .NET information
        run: dotnet --info

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi

          VERSION="${BASH_REMATCH[1]}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Release tag: $TAG"
          echo "Package version: $VERSION"

      - name: Prevent v0.1.0 republish
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.version.outputs.version }}" == "0.1.0" ]]; then
            echo "PGLN.Auth 0.1.0 is already published and immutable."
            exit 1
          fi

      - name: Restore
        run: dotnet restore PGLN.Auth.slnx

      - name: Build
        run: >
          dotnet build PGLN.Auth.slnx
          --configuration Release
          --no-restore

      - name: Test
        env:
          PGLN_AUTH_POSTGRES_TEST_CONNECTION_STRING: "Host=localhost;Port=5432;Database=pgln_auth_tests;Username=pgln_test;Password=ci_test_password"
        run: >
          dotnet test PGLN.Auth.slnx
          --configuration Release
          --no-build
          --no-restore

      - name: Pack release artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/publish

          dotnet pack src/PGLN.Auth/PGLN.Auth.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            --output artifacts/publish \
            -p:PackageVersion="${{ steps.version.outputs.version }}"

      - name: Verify package artifact
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="artifacts/publish/PGLN.Auth.${{ steps.version.outputs.version }}.nupkg"

          if [[ ! -f "$PACKAGE" ]]; then
            echo "Expected package was not produced: $PACKAGE"
            exit 1
          fi

          echo "Package:"
          ls -lh "$PACKAGE"

          echo "SHA-256:"
          sha256sum "$PACKAGE"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PGLN.Auth-${{ steps.version.outputs.version }}
          path: artifacts/publish/PGLN.Auth.${{ steps.version.outputs.version }}.nupkg
          if-no-files-found: error
          retention-days: 90

      - name: Attach package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="artifacts/publish/PGLN.Auth.${{ steps.version.outputs.version }}.nupkg"
          TAG="${{ steps.version.outputs.tag }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists."
          else
            gh release create "$TAG" \
              --title "PGLN.Auth $TAG" \
              --generate-notes \
              --verify-tag
          fi

          gh release upload "$TAG" "$PACKAGE" --clobber

      - name: Authenticate to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Nathi-devDot

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push
          artifacts/publish/PGLN.Auth.${{ steps.version.outputs.version }}.nupkg
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
