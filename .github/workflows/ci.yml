name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pgln_test
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: pgln_auth_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgln_test -d pgln_auth_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Display .NET information
        run: dotnet --info

      - name: Restore
        run: dotnet restore PGLN.Auth.slnx

      - name: Build
        run: >
          dotnet build PGLN.Auth.slnx
          --configuration Release
          --no-restore

      - name: Test
        env:
          PGLN_AUTH_POSTGRES_TEST_CONNECTION_STRING: "Host=localhost;Port=5432;Database=pgln_auth_tests;Username=pgln_test;Password=ci_test_password"
        run: >
          dotnet test PGLN.Auth.slnx
          --configuration Release
          --no-build
          --no-restore