name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Display .NET information
        run: dotnet --info

      - name: Restore
        run: dotnet restore PGLN.Auth.slnx

      - name: Build
        run: >
          dotnet build PGLN.Auth.slnx
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test PGLN.Auth.slnx
          --configuration Release
          --no-build
          --no-restore